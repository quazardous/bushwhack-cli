name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Each package, and the extension, typechecks on its own.
      - run: for p in packages/*/ extension; do npx tsc --noEmit -p "$p" || exit 1; done
      # The app's end-to-end test needs docker and octopod: skipped here.
      - run: npm test
      - run: npm run ext:build
