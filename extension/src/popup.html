<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>bushwhack</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
      --accent: #2563eb; --accent-soft: #eff6ff; --ok: #16a34a; --ok-soft: #dcfce7; --bad: #dc2626; --warn: #b45309;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --card: #181b21; --text: #e5e7eb; --muted: #9ca3af; --line: #2a2f38;
        --accent: #60a5fa; --accent-soft: #172033; --ok: #4ade80; --ok-soft: #14271c; --bad: #f87171; --warn: #fbbf24;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }

    /* Room on the right for the overlay's × */
    .bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 16px; padding: 12px 64px 12px 28px; background: var(--card); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; color: inherit; text-decoration: none; }
    .brand:hover { color: var(--accent); }
    .logo { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--text); color: var(--bg); font-size: 15px; }
    .links { margin-left: auto; font-size: 12px; color: var(--muted); }

    main { padding: 20px 28px 32px; max-width: 1400px; }
    h2 { margin: 26px 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

    /* This chat */
    #tab:empty { display: none; }
    #tab { padding: 14px 16px; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; background: var(--card); }
    #tab.muted { border-left-color: var(--line); }

    /* Services, then their projects as a grid of cards */
    #sessions { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .service { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 8px; }
    .service:first-child { margin-top: 0; }
    .service b { font-size: 15px; }
    .service .paired { padding: 1px 9px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); font-size: 12px; font-weight: 600; }
    .service .row { flex-basis: 100%; max-width: 560px; }
    .service button.quiet { padding: 2px 10px; font-size: 12px; color: var(--muted); }
    .service button.quiet:hover { border-color: var(--bad); color: var(--bad); }

    /* The pairing code: what to do first, so it stands out — a halo that breathes until focused. */
    input[type=text].pair-code { padding: 10px 12px; border: 2px solid var(--accent); font-size: 16px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent); animation: halo 1.8s ease-in-out infinite; }
    input[type=text].pair-code:focus { outline: none; animation: none; box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 38%, transparent); }
    @keyframes halo { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--accent) 8%, transparent); } }
    @media (prefers-reduced-motion: reduce) { input[type=text].pair-code { animation: none; } }
    /* On a dark page a soft halo disappears: a stronger one, and the field lit from inside. */
    @media (prefers-color-scheme: dark) {
      input[type=text].pair-code { background: color-mix(in srgb, var(--accent) 10%, var(--bg)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 45%, transparent); }
      input[type=text].pair-code:focus { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 60%, transparent); }
    }

    /* Asked before forgetting a pairing: in the panel, not a browser dialog over the chat. */
    .confirm { flex-basis: 100%; max-width: 560px; padding: 10px 14px; border: 1px solid var(--bad); border-radius: 10px; background: color-mix(in srgb, var(--bad) 8%, var(--card)); }
    .confirm .row { margin-top: 8px; }
    button.danger { border-color: var(--bad); background: var(--bad); color: #fff; }
    button.danger:hover { filter: brightness(1.08); }

    .session { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
    .session > div:first-child { display: flex; align-items: baseline; gap: 2px; }
    .session b { font-size: 15px; }
    .session .status { font-size: 12px; }
    .session .folder { font: 12px ui-monospace, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session .app, .session .chat { font-size: 13px; }
    .session a { color: var(--accent); text-decoration: none; }
    .session a:hover { text-decoration: underline; }
    .session .row { margin-top: auto; padding-top: 8px; }

    .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    input[type=text] { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: 14px ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; }
    input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button { padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
    button:hover { border-color: var(--muted); }
    button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    button.primary:hover { filter: brightness(1.08); }

    .muted { color: var(--muted); }
    .error { min-height: 1em; margin-top: 12px; color: var(--warn); }
    .setting { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); width: fit-content; }
    .dot { display: inline-block; flex: none; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: #9ca3af; align-self: center; }
    .dot.on { background: var(--ok); }
    .dot.off { background: var(--bad); }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="https://github.com/quazardous/bushwhack-cli" target="_blank" rel="noopener" title="bushwhack on GitHub"><span class="logo">b</span>bushwhack</a>
    <div id="links" class="links"></div>
  </header>
  <main>
    <section id="tab"></section>
    <h2>Projects</h2>
    <div id="sessions" class="muted">Looking…</div>
    <h2>Settings</h2>
    <label class="setting"><input type="checkbox" id="autosend"> Send results automatically</label>
    <div id="error" class="error"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
